document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"537ef4eb-29c7-4b2f-a127-c1807cd4a6aa\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/*\n  NOW Labs — Design Tokens\n  Fonte de verdade prosa: ../docs/15-Sistema-de-Design.md\n  Não editar cores/tipografia direto nos componentes — só aqui.\n*/\n\n@font-face {\n  font-family: 'Plex Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8e6ddeeb-2aed-462e-b3d8-76f55f8d52a4\") format('woff2');\n}\n@font-face {\n  font-family: 'Plex Serif';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"71a669a2-3c14-4075-9439-55f0d8eb3aa8\") format('woff2');\n}\n/* Arquivo variável único — as três declarações abaixo compartilham o mesmo\n   woff2 e o navegador seleciona o eixo de peso correto por font-weight. */\n@font-face {\n  font-family: 'Plex Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a55e7d28-c42c-4b8a-9eec-2f108966f8fc\") format('woff2');\n}\n@font-face {\n  font-family: 'Plex Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"a55e7d28-c42c-4b8a-9eec-2f108966f8fc\") format('woff2');\n}\n@font-face {\n  font-family: 'Plex Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a55e7d28-c42c-4b8a-9eec-2f108966f8fc\") format('woff2');\n}\n@font-face {\n  font-family: 'Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e6f654c6-46dc-4edc-981c-ed1df96b2c66\") format('woff2');\n}\n@font-face {\n  font-family: 'Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"4deca2d8-24b9-4194-868e-67a48009d59b\") format('woff2');\n}\n\n:root {\n  /* Tipografia */\n  --font-display: 'Plex Serif', serif;\n  --font-body: 'Plex Sans', ui-sans-serif, system-ui, sans-serif;\n  --font-mono: 'Plex Mono', ui-monospace, monospace;\n\n  /* Cor — modo claro (padrão) */\n  --bg: #F4F6F1;              /* Papel de Razão */\n  --surface: #FFFFFF;\n  --surface-sunken: #EBEEE7;\n  --text: #12201C;             /* Tinta */\n  --text-muted: #4B5850;\n  --line: rgba(18, 32, 28, 0.14);\n  --line-strong: rgba(18, 32, 28, 0.28);\n\n  --accent: #0E6B72;           /* Petróleo — acento primário de marca */\n  --accent-strong: #0A4F54;\n  --accent-tint: rgba(14, 107, 114, 0.10);\n\n  --brass: #96721F;            /* Latão — acento secundário, uso moderado */\n  --brass-tint: rgba(150, 114, 31, 0.12);\n\n  /* Semânticas — score de conciliação (07-Arquitetura.md). Nunca usar como cor de marca. */\n  --success: #2F7D4F;          /* score >= 95 — automática */\n  --success-tint: rgba(47, 125, 79, 0.12);\n  --warning: #C1571F;          /* score 80-94 — validação humana */\n  --warning-tint: rgba(193, 87, 31, 0.12);\n  --critical: #B33A3A;         /* score < 80 — pendente */\n  --critical-tint: rgba(179, 58, 58, 0.12);\n\n  --shadow: 0 1px 2px rgba(18, 32, 28, 0.06), 0 8px 24px rgba(18, 32, 28, 0.05);\n}\n\n@media (prefers-color-scheme: dark) {\n  :root {\n    --bg: #0F1613;\n    --surface: #17211D;\n    --surface-sunken: #0B100D;\n    --text: #EDF1EC;\n    --text-muted: #9FB0A8;\n    --line: rgba(237, 241, 236, 0.14);\n    --line-strong: rgba(237, 241, 236, 0.26);\n\n    --accent: #4FBFC7;\n    --accent-strong: #7ED4DA;\n    --accent-tint: rgba(79, 191, 199, 0.14);\n\n    --brass: #D9A54B;\n    --brass-tint: rgba(217, 165, 75, 0.14);\n\n    --success: #4CAE7B;\n    --success-tint: rgba(76, 174, 123, 0.14);\n    --warning: #E0864A;\n    --warning-tint: rgba(224, 134, 74, 0.14);\n    --critical: #D9685F;\n    --critical-tint: rgba(217, 104, 95, 0.14);\n\n    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);\n  }\n}\n\n:root[data-theme='dark'] {\n  --bg: #0F1613; --surface: #17211D; --surface-sunken: #0B100D;\n  --text: #EDF1EC; --text-muted: #9FB0A8;\n  --line: rgba(237, 241, 236, 0.14); --line-strong: rgba(237, 241, 236, 0.26);\n  --accent: #4FBFC7; --accent-strong: #7ED4DA; --accent-tint: rgba(79, 191, 199, 0.14);\n  --brass: #D9A54B; --brass-tint: rgba(217, 165, 75, 0.14);\n  --success: #4CAE7B; --success-tint: rgba(76, 174, 123, 0.14);\n  --warning: #E0864A; --warning-tint: rgba(224, 134, 74, 0.14);\n  --critical: #D9685F; --critical-tint: rgba(217, 104, 95, 0.14);\n  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);\n}\n\n:root[data-theme='light'] {\n  --bg: #F4F6F1; --surface: #FFFFFF; --surface-sunken: #EBEEE7;\n  --text: #12201C; --text-muted: #4B5850;\n  --line: rgba(18, 32, 28, 0.14); --line-strong: rgba(18, 32, 28, 0.28);\n  --accent: #0E6B72; --accent-strong: #0A4F54; --accent-tint: rgba(14, 107, 114, 0.10);\n  --brass: #96721F; --brass-tint: rgba(150, 114, 31, 0.12);\n  --success: #2F7D4F; --success-tint: rgba(47, 125, 79, 0.12);\n  --warning: #C1571F; --warning-tint: rgba(193, 87, 31, 0.12);\n  --critical: #B33A3A; --critical-tint: rgba(179, 58, 58, 0.12);\n  --shadow: 0 1px 2px rgba(18, 32, 28, 0.06), 0 8px 24px rgba(18, 32, 28, 0.05);\n}\n<\u002Fstyle>\n  <script src=\"8207a694-30c8-4870-929f-14a16d09b485\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: var(--bg); }\n    input, select { font-family: var(--font-body); }\n    ::placeholder { color: var(--text-muted); opacity: 0.7; }\n  <\u002Fstyle>\n  <script src=\"1fc4b30f-fae2-413d-aaa4-0ed4a0e3457b\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh; background:var(--bg); display:flex; justify-content:center;\">\n  <div style=\"width:100%; max-width:430px; height:100vh; background:var(--bg); color:var(--text); font-family:var(--font-body); display:flex; flex-direction:column; position:relative; overflow:hidden;\">\n\n    <div style=\"padding:22px 20px 14px; background:var(--bg); flex-shrink:0;\">\n      <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:10px;\">\n        <div>\n          <div style=\"font-family:var(--font-mono); font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent);\">Planejamento do casal<\u002Fdiv>\n          <div style=\"font-family:var(--font-display); font-weight:600; font-size:1.45rem; margin-top:3px;\">Finanças do mês<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ openSync }}\" style-hover=\"opacity:0.85;\" style=\"{{ syncPillStyle }}\"><span style=\"{{ syncDotStyle }}\"><\u002Fspan>{{ syncPillLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showMonthSwitcher }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; margin-top:16px; background:var(--surface); border-radius:16px; padding:6px; box-shadow:var(--shadow);\">\n          <div sc-camel-on-click=\"{{ prevMonth }}\" style-hover=\"background:var(--accent-tint); color:var(--accent);\" style=\"{{ prevMonthStyle }}\">‹<\u002Fdiv>\n          <div style=\"font-family:var(--font-display); font-weight:600; font-size:0.98rem;\">{{ viewMonthLabel }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ nextMonth }}\" style-hover=\"background:var(--accent-tint); color:var(--accent);\" style=\"width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:1rem; cursor:pointer; color:var(--text-muted); transition:background 0.15s;\">›<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ !showMonthSwitcher }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"height:2px;\"><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 20px 24px;\">\n\n      <sc-if value=\"{{ isResumo }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); padding:24px; border-radius:20px;\">\n          <div style=\"font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted);\">Saldo previsto · {{ viewMonthLabel }}<\u002Fdiv>\n          <div style=\"font-family:var(--font-display); font-weight:600; font-size:2.2rem; letter-spacing:-0.01em; margin-top:6px; color:{{ saldoColor }};\">{{ saldoFmt }}<\u002Fdiv>\n          <div style=\"font-size:0.85rem; color:var(--text-muted); margin-top:8px; font-variant-numeric:tabular-nums;\">Entradas {{ entradasFmt }} · Saídas {{ saidasFmt }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:22px;\">\n          <div style=\"font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;\">Composição das saídas<\u002Fdiv>\n          <div style=\"height:34px; display:flex; overflow:hidden; border-radius:12px; margin-bottom:14px;\">\n            <sc-for list=\"{{ catSegments }}\" as=\"seg\" hint-placeholder-count=\"3\">\n              <div style=\"width:{{ seg.width }}; background:{{ seg.color }}; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:0.65rem; color:#fff; overflow:hidden;\">{{ seg.tag }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <sc-for list=\"{{ catList }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden;\">\n                <div sc-camel-on-click=\"{{ c.onToggle }}\" style-hover=\"background:var(--surface-sunken);\" style=\"display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer;\">\n                  <span style=\"width:9px; height:9px; border-radius:50%; background:{{ c.color }}; flex-shrink:0;\"><\u002Fspan>\n                  <span style=\"font-size:0.85rem; flex:1;\">{{ c.label }}<\u002Fspan>\n                  <span style=\"font-family:var(--font-mono); font-size:0.85rem; font-variant-numeric:tabular-nums;\">{{ c.amountFmt }}<\u002Fspan>\n                  <span style=\"font-family:var(--font-mono); font-size:0.95rem; color:var(--text-muted); width:14px; text-align:center;\">{{ c.caret }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"{{ c.itemsStyle }}\">\n                  <sc-for list=\"{{ c.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 14px 9px 33px; border-top:1px solid var(--line); font-size:0.8rem; color:var(--text-muted);\">\n                      <span>{{ it.desc }} · {{ it.personLabel }}<\u002Fspan>\n                      <span style=\"font-family:var(--font-mono); font-variant-numeric:tabular-nums; white-space:nowrap;\">{{ it.amountFmt }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:24px;\">\n          <div style=\"font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;\">Por pessoa<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border-radius:18px; overflow:hidden;\">\n            <sc-for list=\"{{ porPessoa }}\" as=\"p\" hint-placeholder-count=\"2\">\n              <div style=\"background:var(--surface); padding:16px;\">\n                <div style=\"font-size:0.8rem; color:var(--text-muted);\">{{ p.name }}<\u002Fdiv>\n                <div style=\"font-family:var(--font-mono); font-size:1.05rem; margin-top:4px; font-variant-numeric:tabular-nums;\">{{ p.amountFmt }}<\u002Fdiv>\n                <div style=\"font-size:0.72rem; color:var(--text-muted); margin-top:2px;\">{{ p.share }} das entradas<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:24px;\">\n          <div style=\"font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;\">Próximas contas<\u002Fdiv>\n          <sc-if value=\"{{ hasUpcomingBills }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:var(--surface); border-radius:18px; overflow:hidden; box-shadow:var(--shadow);\">\n              <sc-for list=\"{{ upcomingBills }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div style-hover=\"background:var(--surface-sunken);\" style=\"display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); gap:10px;\">\n                  <div style=\"flex:1;\">\n                    <div style=\"font-size:0.88rem;\">{{ b.desc }}<\u002Fdiv>\n                    <div style=\"font-size:0.72rem; color:var(--text-muted); margin-top:2px;\">{{ b.dueLabel }} · {{ b.personLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-family:var(--font-mono); font-size:0.88rem; font-variant-numeric:tabular-nums;\">{{ b.amountFmt }}<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ b.onTogglePaid }}\" style=\"font-family:var(--font-mono); font-size:0.64rem; border-radius:999px; background:var(--success-tint); color:var(--success); padding:6px 10px; cursor:pointer; white-space:nowrap;\">Marcar paga<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ !hasUpcomingBills }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:0.85rem; color:var(--text-muted); padding:12px 0;\">Nenhuma conta pendente neste mês.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:28px; display:flex; align-items:center; justify-content:center; gap:22px;\">\n          <span sc-camel-on-click=\"{{ exportData }}\" style=\"font-family:var(--font-mono); font-size:0.72rem; color:var(--accent); cursor:pointer;\">Exportar backup (.txt)<\u002Fspan>\n          <span sc-camel-on-click=\"{{ clearAll }}\" style=\"font-family:var(--font-mono); font-size:0.72rem; color:var(--text-muted); cursor:pointer;\">Zerar todos os dados<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isLancamentos }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display:flex; justify-content:flex-end; margin-bottom:12px;\">\n            <div sc-camel-on-click=\"{{ openImport }}\" style=\"font-family:var(--font-mono); font-size:0.72rem; border-radius:999px; background:var(--accent-tint); color:var(--accent); padding:8px 14px; cursor:pointer;\">+ Importar lista<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; padding-bottom:2px;\">\n            <sc-for list=\"{{ personFilters }}\" as=\"pf\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ pf.onClick }}\" style=\"{{ pf.style }}\">{{ pf.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px;\">Entradas<\u002Fdiv>\n          <div style=\"background:var(--surface); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); margin-bottom:22px;\">\n            <sc-for list=\"{{ entradasList }}\" as=\"e\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ e.onEdit }}\" style-hover=\"background:var(--surface-sunken);\" style=\"display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer;\">\n                <div>\n                  <div style=\"font-size:0.88rem;\">{{ e.desc }}<\u002Fdiv>\n                  <div style=\"font-size:0.72rem; color:var(--text-muted); margin-top:3px;\">{{ e.personLabel }}{{ e.tagSuffix }} · <span sc-camel-on-click=\"{{ e.onClone }}\" style=\"color:var(--accent); cursor:pointer;\">clonar p/ próximo mês<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:var(--font-mono); font-size:0.9rem; color:var(--success); font-variant-numeric:tabular-nums;\">+{{ e.amountFmt }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ entradasEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:16px; font-size:0.85rem; color:var(--text-muted);\">Sem entradas neste mês.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px;\">Saídas<\u002Fdiv>\n          <div style=\"background:var(--surface); border-radius:18px; overflow:hidden; box-shadow:var(--shadow);\">\n            <sc-for list=\"{{ saidasList }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ s.onEdit }}\" style-hover=\"background:var(--surface-sunken);\" style=\"display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer;\">\n                <div>\n                  <div style=\"font-size:0.88rem;\">{{ s.desc }}<\u002Fdiv>\n                  <div style=\"display:flex; align-items:center; gap:8px; margin-top:5px;\">\n                    <span style=\"font-family:var(--font-mono); font-size:0.64rem; padding:3px 9px; border-radius:999px; background:{{ s.catBg }}; color:{{ s.catColor }};\">{{ s.catLabel }}<\u002Fspan>\n                    <span style=\"font-size:0.72rem; color:var(--text-muted);\">{{ s.personLabel }}{{ s.tagSuffix }}<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ s.onClone }}\" style=\"font-size:0.72rem; color:var(--accent); cursor:pointer;\">clonar<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:var(--font-mono); font-size:0.9rem; font-variant-numeric:tabular-nums;\">-{{ s.amountFmt }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ saidasEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:16px; font-size:0.85rem; color:var(--text-muted);\">Sem saídas neste mês.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isContas }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px;\">Contas fixas e parcelamentos · {{ viewMonthLabel }}<\u002Fdiv>\n          <sc-if value=\"{{ hasUnpaidContas }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ markAllPaid }}\" style-hover=\"opacity:0.85;\" style=\"display:flex; align-items:center; justify-content:center; gap:6px; background:var(--success-tint); color:var(--success); padding:11px; border-radius:14px; margin-bottom:12px; font-family:var(--font-mono); font-size:0.78rem; cursor:pointer;\">✓ Marcar todas como pagas ({{ unpaidContasLabel }})<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"background:var(--surface); border-radius:18px; overflow:hidden; box-shadow:var(--shadow);\">\n            <sc-for list=\"{{ contasList }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"padding:16px; border-bottom:1px solid var(--line);\">\n                <div style=\"display:flex; tyle=\"font-size:0.78rem; color:var(--text-muted); margin-bottom:10px; line-height:1.5;\">Uma conta por linha, separada por ; — dia; descrição; valor; parcela (opcional).<br>O dia pode ser só o número (dia do vencimento) ou uma data completa. Lança no mês em exibição.<br>Ex.: 5; Aluguel; 2100 &nbsp;·&nbsp; 10; Celular; 210; 3/10<\u002Fdiv>\n          <textarea value=\"{{ importText }}\" sc-camel-on-change=\"{{ onImportTextChange }}\" placeholder=\"5; Aluguel; 2100\n10; Celular; 210; 3/10\" style=\"width:100%; box-sizing:border-box; min-height:140px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.85rem; font-family:var(--font-mono); margin-bottom:14px;\"><\u002Ftextarea>\n          <div style=\"display:flex; gap:10px;\">\n            <div style=\"flex:1;\"><\u002Fdiv>\n            <div sc-camel-on-click=\"{{ closeImport }}\" style=\"font-family:var(--font-mono); font-size:0.85rem; color:var(--text-muted); border:1px solid var(--line-strong); border-radius:12px; padding:11px 18px; cursor:pointer;\">Cancelar<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ processImport }}\" style=\"font-family:var(--font-mono); font-size:0.85rem; color:var(--bg); background:var(--accent); border-radius:12px; padding:11px 20px; cursor:pointer;\">Processar<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ exportOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute; inset:0; background:rgba(15,22,19,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:50;\">\n        <div style=\"width:100%; max-height:88%; overflow-y:auto; background:var(--surface); box-shadow:var(--shadow); padding:14px 20px 24px; border-radius:26px 26px 0 0;\">\n          <div style=\"width:40px; height:4px; border-radius:999px; background:var(--line-strong); margin:0 auto 16px;\"><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;\">\n            <div style=\"font-family:var(--font-display); font-weight:600; font-size:1.1rem;\">Backup gerado<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ closeExport }}\" style=\"font-family:var(--font-mono); font-size:0.85rem; color:var(--text-muted); cursor:pointer;\">Fechar<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:0.78rem; color:var(--text-muted); margin-bottom:10px; line-height:1.5;\">O arquivo .txt foi baixado. Você também pode copiar o texto abaixo e guardar onde preferir.<\u002Fdiv>\n          <textarea value=\"{{ exportText }}\" readonly=\"\" style=\"width:100%; box-sizing:border-box; min-height:220px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.76rem; font-family:var(--font-mono); line-height:1.5;\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ syncModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute; inset:0; background:rgba(15,22,19,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:50;\">\n        <div style=\"width:100%; max-height:92%; overflow-y:auto; background:var(--surface); box-shadow:var(--shadow); padding:14px 20px 28px; border-radius:26px 26px 0 0;\">\n          <div style=\"width:40px; height:4px; border-radius:999px; background:var(--line-strong); margin:0 auto 16px;\"><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;\">\n            <div style=\"font-family:var(--font-display); font-weight:600; font-size:1.1rem;\">Sincronizar com o parceiro<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ closeSync }}\" style=\"font-family:var(--font-mono); font-size:0.85rem; color:var(--text-muted); cursor:pointer;\">Fechar<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:7px; margin-bottom:14px;\"><span style=\"{{ syncDotStyle }}\"><\u002Fspan><span style=\"font-size:0.8rem; color:{{ syncStatusColor }};\">{{ syncStatusLabel }}<\u002Fspan><\u002Fdiv>\n\n          <div style=\"font-size:0.8rem; color:var(--text-muted); line-height:1.6; margin-bottom:14px;\">\n            <div style=\"margin-bottom:6px;\"><b style=\"color:var(--text);\">1.<\u002Fb> Crie um projeto grátis em supabase.com.<\u002Fdiv>\n            <div style=\"margin-bottom:6px;\"><b style=\"color:var(--text);\">2.<\u002Fb> Em <i>SQL Editor<\u002Fi>, cole e rode o código abaixo (cria a tabela do casal).<\u002Fdiv>\n            <div style=\"margin-bottom:6px;\"><b style=\"color:var(--text);\">3.<\u002Fb> Em <i>Settings → API<\u002Fi>, copie a <i>Project URL<\u002Fi> e a <i>anon public key<\u002Fi> nos campos abaixo.<\u002Fdiv>\n            <div><b style=\"color:var(--text);\">4.<\u002Fb> Combinem o mesmo <i>código do casal<\u002Fi> e toquem em Conectar nos dois celulares.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">SQL para rodar no Supabase (copie)<\u002Flabel>\n          <textarea value=\"{{ syncSql }}\" readonly=\"\" sc-camel-on-click=\"{{ selectAllOnClick }}\" style=\"width:100%; box-sizing:border-box; min-height:150px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.72rem; font-family:var(--font-mono); line-height:1.5; margin-bottom:16px;\"><\u002Ftextarea>\n\n          <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">Project URL<\u002Flabel>\n          <input value=\"{{ syncDraftUrl }}\" sc-camel-on-change=\"{{ onSyncUrlChange }}\" placeholder=\"https://xxxx.supabase.co\" style-focus=\"border-color:var(--accent);\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.85rem; font-family:var(--font-mono); margin-bottom:12px;\">\n\n          <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">anon public key<\u002Flabel>\n          <input value=\"{{ syncDraftKey }}\" sc-camel-on-change=\"{{ onSyncKeyChange }}\" placeholder=\"eyJhbGciOi...\" style-focus=\"border-color:var(--accent);\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.85rem; font-family:var(--font-mono); margin-bottom:12px;\">\n\n          <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">Código do casal (o mesmo nos dois aparelhos)<\u002Flabel>\n          <input value=\"{{ syncDraftCode }}\" sc-camel-on-change=\"{{ onSyncCodeChange }}\" placeholder=\"ex.: nauly-leo-2026\" style-focus=\"border-color:var(--accent);\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.85rem; font-family:var(--font-mono); margin-bottom:8px;\">\n          <div style=\"font-size:0.72rem; color:var(--text-muted); line-height:1.5; margin-bottom:16px;\">Quem conectar primeiro envia os lançamentos atuais; o outro recebe essa lista ao conectar. Depois disso, tudo edita junto.<\u002Fdiv>\n\n          <div style=\"display:flex; gap:10px; align-items:center;\">\n            <sc-if value=\"{{ isSyncConnected }}\" hint-placeholder-val=\"{{ false }}\">\n              <div sc-camel-on-click=\"{{ disconnectSync }}\" style=\"font-family:var(--font-mono); font-size:0.82rem; color:var(--critical); border:1px solid var(--critical); border-radius:12px; padding:11px 16px; cursor:pointer;\">Desconectar<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"flex:1;\"><\u002Fdiv>\n            <div sc-camel-on-click=\"{{ connectSync }}\" style=\"font-family:var(--font-mono); font-size:0.85rem; color:var(--bg); background:var(--accent); border-radius:12px; padding:11px 22px; cursor:pointer;\">Conectar<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute; inset:0; background:rgba(15,22,19,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:50;\">\n        <div style=\"width:100%; max-height:88%; overflow-y:auto; background:var(--surface); box-shadow:var(--shadow); padding:14px 20px 28px; border-radius:26px 26px 0 0;\">\n          <div style=\"width:40px; height:4px; border-radius:999px; background:var(--line-strong); margin:0 auto 16px;\"><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;\">\n            <div style=\"font-family:var(--font-display); font-weight:600; font-size:1.1rem;\">{{ formTitle }}<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ closeForm }}\" style=\"font-family:var(--font-mono); font-size:0.85rem; color:var(--text-muted); cursor:pointer;\">Fechar<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; gap:4px; margin-bottom:16px; background:var(--surface-sunken); border-radius:14px; padding:4px;\">\n            <div sc-camel-on-click=\"{{ setTypeEntrada }}\" style=\"{{ typeEntradaStyle }}\">Entrada<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ setTypeSaida }}\" style=\"{{ typeSaidaStyle }}\">Saída<\u002Fdiv>\n          <\u002Fdiv>\n\n          <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">Descrição<\u002Flabel>\n          <input value=\"{{ draftDesc }}\" sc-camel-on-change=\"{{ onDescChange }}\" placeholder=\"Ex.: Mercado, Aluguel, Viagem\" style-focus=\"border-color:var(--accent);\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.9rem; margin-bottom:14px;\">\n\n          <div style=\"display:flex; gap:12px; margin-bottom:14px;\">\n            <div style=\"flex:1;\">\n              <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">Valor (R$)<\u002Flabel>\n              <input type=\"text\" inputmode=\"decimal\" placeholder=\"Ex.: 6.319,00\" value=\"{{ draftAmount }}\" sc-camel-on-change=\"{{ onAmountChange }}\" style-focus=\"border-color:var(--accent);\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.9rem; font-family:var(--font-mono);\">\n            <\u002Fdiv>\n            <div style=\"flex:1;\">\n              <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">Mês<\u002Flabel>\n              <input type=\"month\" value=\"{{ draftMonth }}\" sc-camel-on-change=\"{{ onMonthChange }}\" style-focus=\"border-color:var(--accent);\" style=\"width:100%; box-sizing:border-box; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.85rem;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">Pessoa<\u002Flabel>\n          <sc-raw-select value=\"{{ draftPerson }}\" sc-camel-on-change=\"{{ onPersonChange }}\" style-focus=\"border-color:var(--accent);\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.9rem; margin-bottom:14px;\">\n            <sc-for list=\"{{ personOptions }}\" as=\"po\" hint-placeholder-count=\"3\">\n              <option value=\"{{ po.value }}\">{{ po.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:14px; cursor:pointer;\" sc-camel-on-click=\"{{ toggleRecurring }}\">\n            <div style=\"{{ checkboxStyle }}\"><\u002Fdiv>\n            <span style=\"font-size:0.86rem;\">Recorrente (repete todo mês)<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isDraftSaida }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex; gap:12px; margin-bottom:6px;\">\n              <div style=\"flex:1;\">\n                <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">Parcelas (1 = à vista)<\u002Flabel>\n                <input type=\"number\" min=\"1\" value=\"{{ draftInstallments }}\" sc-camel-on-change=\"{{ onInstallmentsChange }}\" style-focus=\"border-color:var(--accent);\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.9rem;\">\n              <\u002Fdiv>\n              <div style=\"flex:1;\">\n                <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">Vencimento (dia)<\u002Flabel>\n                <input type=\"number\" min=\"1\" max=\"31\" value=\"{{ draftDueDay }}\" sc-camel-on-change=\"{{ onDueDayChange }}\" placeholder=\"opcional\" style-focus=\"border-color:var(--accent);\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.9rem;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ showParcelaAtual }}\" hint-placeholder-val=\"{{ false }}\">\n              <label style=\"display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:4px;\">Já em andamento? Parcela atual (nesse mês)<\u002Flabel>\n              <input type=\"number\" min=\"1\" value=\"{{ draftParcelaAtual }}\" sc-camel-on-change=\"{{ onParcelaAtualChange }}\" style-focus=\"border-color:var(--accent);\" style=\"width:100%; box-sizing:border-box; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface-sunken); color:var(--text); font-size:0.9rem; margin-bottom:6px;\">\n            <\u002Fsc-if>\n\n            <div style=\"font-size:0.78rem; color:var(--text-muted); margin:10px 0 14px;\">Classificação automática: <span style=\"color:{{ previewCatColor }}; font-family:var(--font-mono);\">{{ previewCatLabel }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex; gap:10px; margin-top:6px;\">\n            <sc-if value=\"{{ isEditing }}\" hint-placeholder-val=\"{{ false }}\">\n              <div sc-camel-on-click=\"{{ deleteEntry }}\" style=\"font-family:var(--font-mono); font-size:0.82rem; color:var(--critical); border:1px solid var(--critical); border-radius:12px; padding:11px 16px; cursor:pointer;\">Excluir<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"flex:1;\"><\u002Fdiv>\n            <div sc-camel-on-click=\"{{ closeForm }}\" style=\"font-family:var(--font-mono); font-size:0.85rem; color:var(--text-muted); border:1px solid var(--line-strong); border-radius:12px; padding:11px 18px; cursor:pointer;\">Cancelar<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ saveEntry }}\" style=\"font-family:var(--font-mono); font-size:0.85rem; color:var(--bg); background:var(--accent); border-radius:12px; padding:11px 20px; cursor:pointer;\">Salvar<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:860},&quot;personA&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nauály&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;personB&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Leonardo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;monthsToProject&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:12,&quot;min&quot;:3,&quot;max&quot;:24,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}\">\nconst CAT_META = {\n  fixa: { label: 'Fixa', color: 'var(--accent)', bg: 'var(--accent-tint)' },\n  variavel: { label: 'Variável', color: 'var(--brass)', bg: 'var(--brass-tint)' },\n  parcelamento: { label: 'Parcelada', color: '#5B6B66', bg: 'rgba(91,107,102,0.14)' },\n};\n\nfunction monthIdxFn(key) {\n  const [y, m] = key.split('-').map(Number);\n  return y * 12 + (m - 1);\n}\nfunction monthKeyFromIdxFn(idx) {\n  const y = Math.floor(idx / 12);\n  const m = (idx % 12) + 1;\n  return `${y}-${String(m).padStart(2, '0')}`;\n}\nfunction addMonthsFn(key, n) {\n  return monthKeyFromIdxFn(monthIdxFn(key) + n);\n}\n\nclass Component extends DCLogic {\n  monthIdx(key) { return monthIdxFn(key); }\n  monthKeyFromIdx(idx) { return monthKeyFromIdxFn(idx); }\n  addMonths(key, n) { return addMonthsFn(key, n); }\n  monthLabel(key) {\n    const [y, m] = key.split('-').map(Number);\n    const d = new Date(y, m - 1, 1);\n    const s = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });\n    return s.charAt(0).toUpperCase() + s.slice(1);\n  }\n  fmt(n) {\n    n = Number(n) || 0;\n    const neg = n < 0;\n    const fixed = Math.abs(n).toFixed(2);\n    const [intPart, decPart] = fixed.split('.');\n    const withDots = intPart.replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.');\n    return (neg ? '-' : '') + 'R$ ' + withDots + ',' + decPart;\n  }\n  classify(draft) {\n    if (draft.type === 'entrada') return 'entrada';\n    if (Number(draft.installments) > 1) return 'parcelamento';\n    if (draft.recurring) return 'fixa';\n    return 'variavel';\n  }\n  isActive(e, key) {\n    const k = this.monthIdx(key), s = this.monthIdx(e.month);\n    if (e.category === 'parcelamento') return k >= s && k < s + (Number(e.installments) || 1);\n    if (e.recurring) return k >= s;\n    return e.month === key;\n  }\n  parcelaAtual(e, key) {\n    return this.monthIdx(key) - this.monthIdx(e.month) + 1;\n  }\n\n  state = (() => {\n    const cur = '2026-07';\n    let entries = [];\n    try {\n      const saved = JSON.parse(localStorage.getItem('pf_entries_v1') || 'null');\n      if (Array.isArray(saved)) entries = saved;\n    } catch (e) {}\n    return {\n      tab: 'resumo',\n      personFilter: 'all',\n      expandedCat: null,\n      exportOpen: false,\n      exportText: '',\n      curMonth: cur,\n      viewMonth: cur,\n      projSelected: cur,\n      entries,\n      formOpen: false,\n      editingId: null,\n      draft: null,\n      importOpen: false,\n      importText: '',\n      sync: null,\n      syncStatus: 'off',\n      syncModalOpen: false,\n      syncDraftUrl: '',\n      syncDraftKey: '',\n      syncDraftCode: '',\n    };\n  })();\n\n  componentDidMount() {\n    let changed = false;\n    const entries = this.state.entries.map(e => {\n      if (e.type === 'entrada' && !e.recurring && this.isLikelySalary(e.desc)) { changed = true; return { ...e, recurring: true }; }\n      return e;\n    });\n    if (changed) this.setState({ entries });\n    let cfg = null;\n    try { cfg = JSON.parse(localStorage.getItem('pf_sync_v1') || 'null'); } catch (e) {}\n    if (cfg && cfg.url && cfg.key && cfg.code) {\n      this.setState({ sync: cfg, syncDraftUrl: cfg.url, syncDraftKey: cfg.key, syncDraftCode: cfg.code });\n      this._connect(cfg);\n    }\n  }\n  _ensureLib() {\n    return new Promise(resolve => {\n      let tries = 0;\n      const check = () => {\n        if (window.supabase && window.supabase.createClient) return resolve(window.supabase);\n        if (++tries > 60) return resolve(null);\n        setTimeout(check, 100);\n      };\n      check();\n    });\n  }\n  openSync() { this.setState({ syncModalOpen: true }); }\n  closeSync() { this.setState({ syncModalOpen: false }); }\n  setSyncField(f, v) { this.setState({ [f]: v }); }\n  async connectSync() {\n    const url = (this.state.syncDraftUrl || '').trim();\n    const key = (this.state.syncDraftKey || '').trim();\n    const code = (this.state.syncDraftCode || '').trim().toLowerCase().replace(/\\s+/g, '-');\n    if (!url || !key || !code) { if (typeof alert === 'function') alert('Preencha a URL, a chave e o código do casal.'); return; }\n    const cfg = { url, key, code };\n    try { localStorage.setItem('pf_sync_v1', JSON.stringify(cfg)); } catch (e) {}\n    this.setState({ sync: cfg, syncDraftCode: code, syncModalOpen: false });\n    this._connect(cfg);\n  }\n  async _connect(cfg) {\n    this.setState({ syncStatus: 'connecting' });\n    const lib = await this._ensureLib();\n    if (!lib) { this.setState({ syncStatus: 'error' }); return; }\n    try {\n      if (this._channel && this._client) { try { this._client.removeChannel(this._channel); } catch (e) {} }\n      this._client = lib.createClient(cfg.url, cfg.key);\n      const res = await this._client.from('couples').select('data').eq('code', cfg.code).maybeSingle();\n      if (res.error) throw res.error;\n      if (res.data && res.data.data) {\n        this._lastRemoteJson = JSON.stringify(res.data.data);\n        this.setState({ entries: res.data.data });\n      } else {\n        this._lastRemoteJson = JSON.stringify(this.state.entries);\n        await this._client.from('couples').upsert({ code: cfg.code, data: this.state.entries, updated_at: new Date().toISOString() });\n      }\n      this._channel = this._client.channel('couple-' + cfg.code)\n        .on('postgres_changes', { event: '*', schema: 'public', table: 'couples', filter: 'code=eq.' + cfg.code }, payload => {\n          const d = payload && payload.new && payload.new.data;\n          if (d) { this._lastRemoteJson = JSON.stringify(d); this.setState({ entries: d }); }\n        })\n        .subscribe();\n      this.setState({ syncStatus: 'online' });\n    } catch (e) { this.setState({ syncStatus: 'error' }); }\n  }\n  _schedulePush() {\n    clearTimeout(this._pushTimer);\n    this._pushTimer = setTimeout(async () => {\n      if (!this._client || !this.state.sync) return;\n      try {\n        await this._client.from('couples').upsert({ code: this.state.sync.code, data: this.state.entries, updated_at: new Date().toISOString() });\n        this._lastRemoteJson = JSON.stringify(this.state.entries);\n      } catch (e) {}\n    }, 600);\n  }\n  disconnectSync() {\n    if (this._channel && this._client) { try { this._client.removeChannel(this._channel); } catch (e) {} }\n    this._client = null; this._channel = null;\n    try { localStorage.removeItem('pf_sync_v1'); } catch (e) {}\n    this.setState({ sync: null, syncStatus: 'off', syncModalOpen: false });\n  }\n  markAllPaid() {\n    this.setState(s => ({\n      entries: s.entries.map(e => {\n        if (e.type === 'saida' && (e.category === 'fixa' || e.category === 'parcelamento') && this.isActive(e, s.viewMonth) && !e.paidMonths.includes(s.viewMonth)) {\n          return { ...e, paidMonths: [...e.paidMonths, s.viewMonth] };\n        }\n        return e;\n      }),\n    }));\n  }\n  componentDidUpdate() {\n    if (this.state.entries !== this._lastSavedEntries) {\n      this._lastSavedEntries = this.state.entries;\n      const json = JSON.stringify(this.state.entries);\n      try { localStorage.setItem('pf_entries_v1', json); } catch (e) {}\n      if (this._client && this.state.syncStatus === 'online' && json !== this._lastRemoteJson) this._schedulePush();\n    }\n  }\n  personLabel(code) {\n    if (code === 'A') return this.props.personA || 'Você';\n    if (code === 'B') return this.props.personB || 'Parceiro(a)';\n    return 'Casal';\n  }\n\n  setTab(tab) { this.setState({ tab }); }\n  prevMonth() { this.setState(s => (this.monthIdx(s.viewMonth) > this.monthIdx(s.curMonth) ? { viewMonth: this.addMonths(s.viewMonth, -1) } : {})); }\n  nextMonth() { this.setState(s => ({ viewMonth: this.addMonths(s.viewMonth, 1) })); }\n\n  openQuickAdd() {\n    const s = this.state;\n    let month = s.viewMonth, recurring = false, type = 'saida';\n    if (s.tab === 'contas') recurring = true;\n    if (s.tab === 'projecao') month = s.projSelected;\n    this.setState({\n      formOpen: true, editingId: null,\n      draft: { type, desc: '', amount: '', person: 'Casal', month, recurring, installments: 1, parcelaAtual: 1, dueDay: '' },\n    });\n  }\n  openProjEventForm() {\n    this.setState(s => ({\n      formOpen: true, editingId: null,\n      draft: { type: 'saida', desc: '', amount: '', person: 'Casal', month: s.projSelected, recurring: false, installments: 1, parcelaAtual: 1, dueDay: '' },\n    }));\n  }\n  openEdit(entry, ctxMonth) {\n    const s = this.state;\n    const ref = ctxMonth || s.viewMonth;\n    const isParc = entry.category === 'parcelamento';\n    const refMonth = isParc ? ref : entry.month;\n    const parcelaAtual = isParc ? this.parcelaAtual(entry, ref) : 1;\n    this.setState({\n      formOpen: true, editingId: entry.id,\n      draft: { type: entry.type, desc: entry.desc, amount: String(entry.amount), person: entry.person, month: refMonth, recurring: entry.recurring, installments: entry.installments, parcelaAtual, dueDay: entry.dueDay ? String(entry.dueDay) : '' },\n    });\n  }\n  closeForm() { this.setState({ formOpen: false, draft: null, editingId: null }); }\n  isLikelyFixed(desc) {\n    const norm = String(desc || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');\n    const keywords = [\n      'aluguel', 'condominio', 'iptu', 'financiamento', 'prestacao', 'consorcio',\n      'agua', 'esgoto', 'energia', 'luz', 'gas', 'internet', 'telefone', 'celular',\n      'vivo', 'claro', 'tim', 'oi ', 'algar', 'sky', 'net ',\n      'seguro', 'ipva', 'plano de saude', 'plano odontologico', 'unimed', 'amil', 'sulamerica', 'hapvida', 'bradesco saude',\n      'escola', 'faculdade', 'universidade', 'curso', 'mensalidade', 'matricula',\n      'academia', 'netflix', 'spotify', 'amazon prime', 'disney', 'hbo', 'youtube premium', 'icloud', 'google one', 'assinatura',\n      'sindico', 'alarme', 'monitoramento', 'diarista', 'faxineira', 'pensao',\n    ];\n    return keywords.some(k => norm.includes(k));\n  }\n  isLikelySalary(desc) {\n    const norm = String(desc || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');\n    const keywords = ['salario', 'pagamento', 'pro labore', 'pro-labore', 'aposentadoria', 'beneficio', 'pensao', 'bolsa', 'renda', 'mesada', 'aluguel recebido', 'freela', 'comissao', 'dividendo', 'rendimento', 'vale'];\n    return keywords.some(k => norm.includes(k));\n  }\n  updateDraft(field, value) {\n    this.setState(s => {\n      const draft = { ...s.draft, [field]: value };\n      if (field === 'desc' && !s.editingId) {\n        if (draft.type === 'saida' && Number(draft.installments) <= 1) draft.recurring = this.isLikelyFixed(value);\n        else if (draft.type === 'entrada') draft.recurring = this.isLikelySalary(value);\n      }\n      return { draft };\n    });\n  }\n  clearAll() {\n    if (typeof confirm === 'function' && !confirm('Apagar TODOS os lançamentos? Essa ação não pode ser desfeita.')) return;\n    this.setState({ entries: [] });\n  }\n  setTypeEntrada() {\n    this.setState(s => {\n      const draft = { ...s.draft, type: 'entrada' };\n      if (!s.editingId) draft.recurring = this.isLikelySalary(draft.desc);\n      return { draft };\n    });\n  }\n  setTypeSaida() {\n    this.setState(s => {\n      const draft = { ...s.draft, type: 'saida' };\n      if (!s.editingId && Number(draft.installments) <= 1) draft.recurring = this.isLikelyFixed(draft.desc);\n      return { draft };\n    });\n  }\n  toggleRecurring() { this.setState(s => ({ draft: { ...s.draft, recurring: !s.draft.recurring } })); }\n\n  saveEn
